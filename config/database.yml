# PostgreSQL. Ensure the pg gem is defined in your Gemfile
#   gem "pg", "~> 1.1"

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("POSTGRES_USER") { "postgres" } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { "" } %>
  host: <%= ENV.fetch("POSTGRES_HOST") { "localhost" } %>

development:
  <<: *default
  database: task_management_app_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: task_management_app_test

production:
  primary:
    <<: *default
    database: task_management_app_production
    username: task_management_app
    password: <%= ENV["TASK_MANAGEMENT_APP_DATABASE_PASSWORD"] %>
  cache:
    <<: *default
    database: task_management_app_production_cache
    username: task_management_app
    password: <%= ENV["TASK_MANAGEMENT_APP_DATABASE_PASSWORD"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: task_management_app_production_queue
    username: task_management_app
    password: <%= ENV["TASK_MANAGEMENT_APP_DATABASE_PASSWORD"] %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: task_management_app_production_cable
    username: task_management_app
    password: <%= ENV["TASK_MANAGEMENT_APP_DATABASE_PASSWORD"] %>
    migrations_paths: db/cable_migrate
